<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Байкал Прогулки</title>
    <meta name="description" content="Кажется, вы уплыли не в ту бухту. Вернитесь на главную и выберите маршрут по душе.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0077b6 0%, #00a8e8 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        h1 {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            background: #fff;
            color: #0077b6;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background: #f0f8ff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .btn i {
            margin-right: 8px;
        }
        .links {
            margin-top: 2rem;
            font-size: 0.95rem;
            opacity: 0.8;
        }
        .links a {
            color: #fff;
            text-decoration: underline;
            margin: 0 0.5rem;
        }
        .links a:hover {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌊</div>
        <h1>404</h1>
        <h2>Вы уплыли не в ту бухту</h2>
        <p>
            Кажется, этой страницы не существует.<br>
            Возможно, её смыло байкальской волной или унёс ветер с Ольхона.
        </p>
        <a href="/" class="btn"><i class="fas fa-home"></i> Вернуться на главную</a>
        <div class="links">
            Или посмотрите:
            <a href="/#routes">маршруты</a> |
            <a href="/#prices">цены</a> |
            <a href="tel:+79642276716">позвонить капитану</a>
        </div>
    </div>
</body>
</html>
